name: Deploy UAT

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        run: ./mvnw package -DskipTests

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}

      - name: Ensure remote directory exists
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} \
            "mkdir -p /opt/tv-dd/sale-system-uat/target"

      - name: Upload deployment files
        run: |
          scp -o StrictHostKeyChecking=no Dockerfile docker-compose.yml \
            ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }}:/opt/tv-dd/sale-system-uat/
          scp -o StrictHostKeyChecking=no target/sale-system.jar \
            ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }}:/opt/tv-dd/sale-system-uat/target/sale-system.jar

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} \
            "cd /opt/tv-dd/sale-system-uat && docker compose up -d --build"

      - name: Health check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} '
            set -e
            cd /opt/tv-dd/sale-system-uat
            set -a; source .env; set +a

            for i in {1..10}; do
              if curl -sf "http://localhost:8084/health" > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed"
            docker compose logs --tail=100
            exit 1
          '
